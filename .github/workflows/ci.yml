name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test and pack
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MonixOne.Security.Authentication.sln --disable-parallel

      - name: Build
        run: >-
          dotnet build MonixOne.Security.Authentication.sln --configuration Release --no-restore
          --disable-build-servers -m:1 -p:GeneratePackageOnBuild=false

      - name: Test
        run: >-
          dotnet test --project
          tests/MonixOne.Security.Authentication.Tests/MonixOne.Security.Authentication.Tests.csproj
          --configuration Release --no-build --no-restore --
          --minimum-expected-tests 10 --no-ansi --progress off

      - name: Pack
        run: >-
          dotnet pack src/MonixOne.Security.Authentication/MonixOne.Security.Authentication.csproj
          --configuration Release --no-build --output artifacts/nuget
          -p:GeneratePackageOnBuild=false
